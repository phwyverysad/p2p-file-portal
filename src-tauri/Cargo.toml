[package]
name = "p2p-file-portal"
version = "1.0.1"
description = "P2P File Portal - Instant Local & Tunnel File Sharing Desktop App"
authors = ["Woranat"]
edition = "2021"

[lib]
name = "local_file_sharer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
futures-util = { version = "0.3", features = ["io"] }
rand = "0.8"
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
local-ip-address = "0.6"
open = "5.3"
dirs = "7.0"
rfd = "0.16"
async_zip = { version = "0.0.19", features = ["deflate", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[[bin]]
name = "p2p-file-portal"
path = "src/main.rs"

[[bin]]
name = "p2p-file-portal-installer"
path = "src/bin/installer.rs"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_UI_Shell"
] }

[dev-dependencies]
tempfile = "3.8"
